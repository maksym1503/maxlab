name: MaxLab CI
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: iPhone Simulator app and UI-test build
        run: xcodebuild -project MaxLab.xcodeproj -scheme MaxLab -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing
